<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /*@FONTS@*/
    body { margin: 0; background: #0B1C2D; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; }
    a { color: #F5C842; text-decoration: none; }
    a:hover { color: #C8922A; }
  </style>
</helmet>

<!-- 1080x1350 = 4:5 feed. Same content as the poster, recomposed - not scaled. -->
<div style="position: relative; width: 1080px; height: 1350px; background: #0B1C2D; overflow: hidden;">

  <img src="market-hero.jpg" alt="DESCRIBE THE PHOTO" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 52%; display: block;">

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 19, 32, 0.95) 0%, rgba(7, 19, 32, 0.9) 25%, rgba(7, 19, 32, 0.44) 40%, rgba(7, 19, 32, 0) 51%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7, 19, 32, 0.97) 0%, rgba(7, 19, 32, 0.93) 20%, rgba(7, 19, 32, 0.36) 33%, rgba(7, 19, 32, 0) 43%);"></div>
  <div style="position: absolute; inset: 0; background: rgba(11, 28, 45, 0.14);"></div>

  <div style="position: absolute; inset: 26px; border: 2px solid rgba(200, 146, 42, 0.9);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 60px 64px 54px; display: flex; flex-direction: column; justify-content: space-between; align-items: center;">

    <div style="display: flex; flex-direction: column; align-items: center;">

      <img src="bb-logo.png" alt="Backyard Brew" style="width: 156px; height: 156px; display: block;">

      <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; line-height: 0.9;">
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 76px; letter-spacing: 0.06em; color: #F5EFD8; text-shadow: 0 6px 22px rgba(4, 12, 21, 0.7);">BACKYARD</div>
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 102px; letter-spacing: 0.005em; color: #F5C842; text-shadow: 0 8px 26px rgba(4, 12, 21, 0.75);">EVENT NAME</div>
      </div>

      <div style="margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 20px; background: #F5C842; padding: 12px 40px 9px; box-shadow: 0 12px 30px rgba(4, 12, 21, 0.55);">
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 58px; color: #0B1C2D; line-height: 1; letter-spacing: 0.02em;">DAY</div>
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 0 18 9 9 18 0 9Z" fill="#0B1C2D"></path></svg>
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 58px; color: #0B1C2D; line-height: 1; letter-spacing: 0.02em;">TIME</div>
      </div>

      <div style="margin-top: 20px; font-size: 27px; font-weight: 700; letter-spacing: 0.14em; color: #F5EFD8; text-transform: uppercase; text-shadow: 0 4px 14px rgba(4, 12, 21, 0.85);">One line that says what this is</div>

    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;">

      <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0;">

        <div style="display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 7px 10px 8px;">
          <div style="font-size: 56px; line-height: 1.1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;" aria-hidden="true">🛍️</div>
          <div style="font-size: 24px; font-weight: 700; letter-spacing: 0.11em; color: #F5EFD8; text-transform: uppercase; text-align: center;">Draw One</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 7px 10px 8px; border-left: 2px solid rgba(200, 146, 42, 0.55); border-right: 2px solid rgba(200, 146, 42, 0.55);">
          <div style="font-size: 56px; line-height: 1.1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;" aria-hidden="true">🎸</div>
          <div style="font-size: 24px; font-weight: 700; letter-spacing: 0.11em; color: #F5EFD8; text-transform: uppercase; text-align: center;">Draw Two</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 11px; padding: 7px 10px 8px;">
          <div style="font-size: 56px; line-height: 1.1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;" aria-hidden="true">🍺</div>
          <div style="font-size: 24px; font-weight: 700; letter-spacing: 0.11em; color: #F5EFD8; text-transform: uppercase; text-align: center;">Draw Three</div>
        </div>

      </div>

      <div style="font-size: 27px; font-weight: 500; letter-spacing: 0.03em; color: rgba(245, 239, 216, 0.86);">A line in the bar's voice.</div>

      <div style="width: 100%; box-sizing: border-box; background: #F5C842; border: 4px solid #0B1C2D; box-shadow: 0 16px 40px rgba(4, 12, 21, 0.6); padding: 17px 26px 15px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-size: 22px; font-weight: 700; letter-spacing: 0.17em; color: rgba(11, 28, 45, 0.82); text-transform: uppercase;">Who this is for</div>
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 78px; line-height: 1; color: #0B1C2D; letter-spacing: 0.01em;">THE HOOK</div>
        <div style="font-size: 27px; font-weight: 700; letter-spacing: 0.04em; color: #0B1C2D;">The one thing to do next</div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
