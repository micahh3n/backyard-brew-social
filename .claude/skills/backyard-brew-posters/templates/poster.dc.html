<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /*@FONTS@*/
    body { margin: 0; background: #0B1C2D; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; }
    a { color: #F5C842; text-decoration: none; }
    a:hover { color: #C8922A; }
  </style>
</helmet>

<!-- 1620x2160 = 18x24in at 90dpi. Swap the display font family below to whatever
     references/fonts.md points you at; keep Barlow Condensed on every small line. -->
<div style="position: relative; width: 1620px; height: 2160px; background: #0B1C2D; overflow: hidden;">

  <img src="market-hero.jpg" alt="DESCRIBE THE PHOTO" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;">

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7, 19, 32, 0.95) 0%, rgba(7, 19, 32, 0.9) 24%, rgba(7, 19, 32, 0.42) 38%, rgba(7, 19, 32, 0) 49%);"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(7, 19, 32, 0.97) 0%, rgba(7, 19, 32, 0.93) 19%, rgba(7, 19, 32, 0.36) 32%, rgba(7, 19, 32, 0) 42%);"></div>
  <div style="position: absolute; inset: 0; background: rgba(11, 28, 45, 0.14);"></div>

  <div style="position: absolute; inset: 40px; border: 3px solid rgba(200, 146, 42, 0.9);"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 92px 104px 84px; display: flex; flex-direction: column; justify-content: space-between; align-items: center;">

    <div style="display: flex; flex-direction: column; align-items: center;">

      <img src="bb-logo.png" alt="Backyard Brew" style="width: 232px; height: 232px; display: block;">

      <div style="margin-top: 34px; display: flex; flex-direction: column; align-items: center; line-height: 0.9;">
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 112px; letter-spacing: 0.06em; color: #F5EFD8; text-shadow: 0 8px 30px rgba(4, 12, 21, 0.7);">BACKYARD</div>
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 150px; letter-spacing: 0.005em; color: #F5C842; text-shadow: 0 10px 34px rgba(4, 12, 21, 0.75);">EVENT NAME</div>
      </div>

      <div style="margin-top: 32px; display: flex; align-items: center; justify-content: center; gap: 28px; background: #F5C842; padding: 17px 60px 13px; box-shadow: 0 16px 40px rgba(4, 12, 21, 0.55);">
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 84px; color: #0B1C2D; line-height: 1; letter-spacing: 0.02em;">DAY</div>
        <svg width="25" height="25" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 0 18 9 9 18 0 9Z" fill="#0B1C2D"></path></svg>
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 84px; color: #0B1C2D; line-height: 1; letter-spacing: 0.02em;">TIME</div>
      </div>

      <div style="margin-top: 28px; font-size: 40px; font-weight: 700; letter-spacing: 0.15em; color: #F5EFD8; text-transform: uppercase; text-shadow: 0 4px 16px rgba(4, 12, 21, 0.85);">One line that says what this is</div>

    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 30px;">

      <!-- Feature row. Emoji, never drawn icons. Delete the whole grid if the event has no three draws. -->
      <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0;">

        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 16px 12px;">
          <div style="font-size: 84px; line-height: 1.1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;" aria-hidden="true">🛍️</div>
          <div style="font-size: 36px; font-weight: 700; letter-spacing: 0.14em; color: #F5EFD8; text-transform: uppercase; text-align: center;">Draw One</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 16px 12px; border-left: 2px solid rgba(200, 146, 42, 0.55); border-right: 2px solid rgba(200, 146, 42, 0.55);">
          <div style="font-size: 84px; line-height: 1.1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;" aria-hidden="true">🎸</div>
          <div style="font-size: 36px; font-weight: 700; letter-spacing: 0.14em; color: #F5EFD8; text-transform: uppercase; text-align: center;">Draw Two</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 16px 12px;">
          <div style="font-size: 84px; line-height: 1.1; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;" aria-hidden="true">🍺</div>
          <div style="font-size: 36px; font-weight: 700; letter-spacing: 0.14em; color: #F5EFD8; text-transform: uppercase; text-align: center;">Draw Three</div>
        </div>

      </div>

      <div style="font-size: 40px; font-weight: 500; letter-spacing: 0.04em; color: rgba(245, 239, 216, 0.86);">A line in the bar's voice.</div>

      <!-- Gold callout. Sized BELOW the event name on purpose - the solid ground does the shouting. -->
      <div style="width: 100%; box-sizing: border-box; background: #F5C842; border: 5px solid #0B1C2D; box-shadow: 0 20px 50px rgba(4, 12, 21, 0.6); padding: 24px 40px 22px; display: flex; flex-direction: column; align-items: center; gap: 9px;">
        <div style="font-size: 32px; font-weight: 700; letter-spacing: 0.2em; color: rgba(11, 28, 45, 0.82); text-transform: uppercase;">Who this is for</div>
        <div style="font-family: 'Lilita One', 'Arial Black', Impact, sans-serif; font-size: 114px; line-height: 1; color: #0B1C2D; letter-spacing: 0.01em;">THE HOOK</div>
        <div style="font-size: 40px; font-weight: 700; letter-spacing: 0.05em; color: #0B1C2D;">The one thing to do next</div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1620,"height":2160}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
